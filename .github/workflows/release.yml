name: release

# Build and publish production images to GHCR on version tags.
# Does not SSH/deploy to a VM — that stays an ops step (docs/ops/deploy.md).
# After publish: pull ghcr.io/<owner>/<repo>/core-api:<tag> on the host.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: git sha short)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  # Buildx GHA cache write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO_LC}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "core_api=${{ env.REGISTRY }}/${OWNER_LC}/${REPO_LC}/core-api" >> "$GITHUB_OUTPUT"
          echo "ssh_gateway=${{ env.REGISTRY }}/${OWNER_LC}/${REPO_LC}/ssh-gateway" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker tags
        id: tags
        run: |
          set -euo pipefail
          CORE="${{ steps.meta.outputs.core_api }}:${{ steps.meta.outputs.tag }}"
          SSH="${{ steps.meta.outputs.ssh_gateway }}:${{ steps.meta.outputs.tag }}"
          # Only retag :latest for real version tags (v*), not manual sha publishes.
          if [[ "${{ github.ref_type }}" == "tag" && "${{ steps.meta.outputs.tag }}" == v* ]]; then
            CORE+=$'\n'"${{ steps.meta.outputs.core_api }}:latest"
            SSH+=$'\n'"${{ steps.meta.outputs.ssh_gateway }}:latest"
          fi
          {
            echo "core<<EOF"
            echo "$CORE"
            echo "EOF"
            echo "ssh<<EOF"
            echo "$SSH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push core-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/core-api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.core }}
          cache-from: type=gha,scope=core-api-release
          cache-to: type=gha,mode=max,scope=core-api-release
          provenance: false

      - name: Build and push ssh-gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/ssh-gateway/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.ssh }}
          cache-from: type=gha,scope=ssh-gateway-release
          cache-to: type=gha,mode=max,scope=ssh-gateway-release
          provenance: false

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Published images
          - \`${{ steps.meta.outputs.core_api }}:${{ steps.meta.outputs.tag }}\`
          - \`${{ steps.meta.outputs.ssh_gateway }}:${{ steps.meta.outputs.tag }}\`

          Pull on the host, then point Compose \`image:\` at these refs (or retag locally).
          EOF
