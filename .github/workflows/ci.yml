name: ci

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: beer_shop
          POSTGRES_USER: beer
          POSTGRES_PASSWORD: beer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beer -d beer_shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_DSN: postgres://beer:beer@localhost:5432/beer_shop?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go fmt check
        run: |
          test -z "$(gofmt -l .)"

      - name: Go test
        run: |
          go test ./...

      - name: Vulnerability scan (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          check-latest: true
          repo-checkout: false
          work-dir: .

      - name: Migration smoke (core-api migrate up)
        run: |
          go run ./services/core-api/cmd/migrate up

      - name: E2E smoke (seed demo + core-api + HTTP checks)
        env:
          HTTP_ADDR: ":18080"
          CORE_API_HMAC_KEYS: dev:dev-hmac-secret
          CORE_API_HMAC_KEY_ID: dev
          EMAIL_PROVIDER: log
        run: |
          go run ./services/core-api/cmd/api seed demo
          go run ./services/core-api/cmd/api &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          export BASE_URL=http://localhost:18080
          export SSH_FINGERPRINT=demo:ssh-fingerprint
          export CORE_API_HMAC_KEYS=dev:dev-hmac-secret
          go run ./services/core-api/cmd/e2e-smoke

      - name: Docker build (compose)
        run: |
          docker compose -f infra/compose.yaml build

