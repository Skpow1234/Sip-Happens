# Production overlay: no published database/cache ports; load secrets from env file.
# Usage:
#   cp infra/env.prod.example .env.prod   # fill in secrets
#   docker compose -f infra/compose.yaml -f infra/compose.prod.yaml --env-file .env.prod up -d
services:
  postgres:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}

  redis:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}

  core-api:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}
    restart: unless-stopped
    ports: []

  ssh-gateway:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}
    environment:
      SSH_REQUIRE_AUTHORIZED_KEYS: ${SSH_REQUIRE_AUTHORIZED_KEYS:-1}
    # Publish the shop SSH listener. Customers connect here (not via Caddy).
    # Use 22 only if nothing else on the host binds it; otherwise keep 2222
    # and point DNS / a firewall DNAT at this port. See docs/ops/deploy.md.
    ports:
      - "${SIP_HAPPENS_SSH_PORT:-2222}:2222"
    restart: unless-stopped

  order-reaper:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}
    restart: unless-stopped

  stripe-reconcile:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}
    restart: unless-stopped

  outbox-dispatch:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}
    restart: unless-stopped

  nats-consume:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}
    restart: unless-stopped

  fulfillment-runner:
    env_file:
      - ${SIP_HAPPENS_ENV_FILE:-.env.prod}
    restart: unless-stopped

  caddy:
    restart: unless-stopped
