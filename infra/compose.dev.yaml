# Local developer overlay: publish infra and API ports on the host.
# Usage: docker compose -f infra/compose.yaml -f infra/compose.dev.yaml up -d
#
# Optional: debug outbox without NATS (events only in outbox-dispatch logs; nats-consume idle):
#   OUTBOX_PUBLISHER=log docker compose -f infra/compose.yaml -f infra/compose.dev.yaml up -d outbox-dispatch
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  nats:
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  core-api:
    ports:
      - "${SIP_HAPPENS_HTTP_PORT:-8080}:8080"

  ssh-gateway:
    ports:
      - "${SIP_HAPPENS_SSH_PORT:-2222}:2222"
    environment:
      SSH_DEV_FINGERPRINT: ${SSH_DEV_FINGERPRINT:-SHA256:bO2LRb2AvETPxiykJemvR1cPIDiRfLlTadBTHeqMLzM}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-https://sip-happens.local/privacy}
      CONSUMER_RIGHTS_URL: ${CONSUMER_RIGHTS_URL:-https://www.sic.gov.co/proteccion-del-consumidor}
      DATA_PROCESSING_POLICY_URL: ${DATA_PROCESSING_POLICY_URL:-https://sip-happens.local/legal/data-processing}
    volumes:
      - sshkeys:/data
      - ./demo/authorized_keys:/data/authorized_keys:ro
