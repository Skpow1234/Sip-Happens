# Base stack (internal networking). Local dev publishes host ports via compose.dev.yaml.
# Production: add compose.prod.yaml and --env-file .env.prod (see infra/env.prod.example).
services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: beer_shop
      POSTGRES_USER: beer
      POSTGRES_PASSWORD: beer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beer -d beer_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: ..
      dockerfile: services/core-api/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://beer:beer@postgres:5432/beer_shop?sslmode=disable"
      MIGRATIONS_PATH: "/app/infra/migrations"
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-sip_happens}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MOCK: ${STRIPE_MOCK:-1}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      CORE_API_HMAC_KEY_ID: ${CORE_API_HMAC_KEY_ID:-dev}
      CORE_API_HMAC_KEYS: ${CORE_API_HMAC_KEYS:-dev:dev-hmac-secret}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FEATURE_FLAGS: ${FEATURE_FLAGS:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-miniosecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/product-images}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-0}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/core-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  core-migrate:
    image: infra-core-api
    entrypoint: ["/app/core-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://beer:beer@postgres:5432/beer_shop?sslmode=disable"
      MIGRATIONS_PATH: "/app/infra/migrations"

  core-jobs:
    image: infra-core-api
    entrypoint: ["/app/core-jobs"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://beer:beer@postgres:5432/beer_shop?sslmode=disable"
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-sip_happens}

  ssh-gateway:
    build:
      context: ..
      dockerfile: services/ssh-gateway/Dockerfile
    environment:
      CORE_API_URL: "http://core-api:8080"
      SSH_ADDR: "0.0.0.0:2222"
      SSH_HOST_KEY_PATH: "/data/ssh_host_ed25519_key"
      # Dev: any SSH public key is accepted; demo seed customer uses this fingerprint when no key is offered.
      SSH_REQUIRE_AUTHORIZED_KEYS: ${SSH_REQUIRE_AUTHORIZED_KEYS:-0}
      SSH_AUTHORIZED_KEYS_PATH: ${SSH_AUTHORIZED_KEYS_PATH:-/data/authorized_keys}
      SSH_DEV_FINGERPRINT: ${SSH_DEV_FINGERPRINT:-SHA256:bO2LRb2AvETPxiykJemvR1cPIDiRfLlTadBTHeqMLzM}
      PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-https://sip-happens.local/privacy}
      SSH_DISABLE_PASSWORD_AUTH: ${SSH_DISABLE_PASSWORD_AUTH:-1}
      SSH_DISABLE_PORT_FORWARDING: ${SSH_DISABLE_PORT_FORWARDING:-1}
      CORE_API_HMAC_KEY_ID: ${CORE_API_HMAC_KEY_ID:-dev}
      CORE_API_HMAC_KEYS: ${CORE_API_HMAC_KEYS:-dev:dev-hmac-secret}
    depends_on:
      core-api:
        condition: service_healthy
    ports:
      - "2222:2222"
    volumes:
      - sshkeys:/data
    healthcheck:
      test: ["CMD", "/app/ssh-gateway", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  order-reaper:
    image: infra-core-api
    entrypoint: ["/app/core-jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://beer:beer@postgres:5432/beer_shop?sslmode=disable"
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-30}
      JOB_BATCH_LIMIT: ${JOB_BATCH_LIMIT:-100}
    command: ["cancel-expired"]

  stripe-reconcile:
    image: infra-core-api
    entrypoint: ["/app/core-jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://beer:beer@postgres:5432/beer_shop?sslmode=disable"
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-60}
      JOB_BATCH_LIMIT: ${JOB_BATCH_LIMIT:-100}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_MOCK: ${STRIPE_MOCK:-1}
    command: ["stripe-reconcile"]

  outbox-dispatch:
    image: infra-core-api
    entrypoint: ["/app/core-jobs"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://beer:beer@postgres:5432/beer_shop?sslmode=disable"
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-sip_happens}
      OUTBOX_PUBLISHER: ${OUTBOX_PUBLISHER:-nats}
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-5}
      JOB_BATCH_LIMIT: ${JOB_BATCH_LIMIT:-100}
      OUTBOX_LOCKED_BY: ${OUTBOX_LOCKED_BY:-outbox-dispatcher}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OUTBOX_BASE_BACKOFF_SECONDS: ${OUTBOX_BASE_BACKOFF_SECONDS:-30}
    command: ["outbox-dispatch"]

  nats-consume:
    image: infra-core-api
    entrypoint: ["/app/core-jobs"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://beer:beer@postgres:5432/beer_shop?sslmode=disable"
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_STREAM: ${NATS_STREAM:-sip_happens}
      NAMESPACE: ${NAMESPACE:-dev}
      NATS_DURABLE: ${NATS_DURABLE:-order-paid-fulfillment}
      NATS_CONSUMER_NAME: ${NATS_CONSUMER_NAME:-order-paid-fulfillment}
    command: ["nats-consume"]

  fulfillment-runner:
    image: infra-core-api
    entrypoint: ["/app/core-jobs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://beer:beer@postgres:5432/beer_shop?sslmode=disable"
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-30}
      JOB_BATCH_LIMIT: ${JOB_BATCH_LIMIT:-100}
    command: ["fulfillment-runner"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-miniosecret}
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T19-55-45Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/product-images || true;
      mc anonymous set download local/product-images;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-miniosecret}

  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - core-api

  # Optional: run Stripe CLI in a container (so you don't need local installs).
  # Usage examples are documented in docs/runbooks/stripe-webhook-local.md
  stripe-cli:
    image: stripe/stripe-cli:latest
    environment:
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    depends_on:
      - core-api

volumes:
  sshkeys:
  miniodata:
